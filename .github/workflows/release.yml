name: Release

# `npm run release` starts this workflow (workflow_dispatch) and waits for it.
# You can also start it from the Actions tab ("Run workflow"), or by pushing a
# tag named v<version> that matches package.json.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Replace the files of a version that is already published"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match the version in package.json
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json (expected $expected)."
            exit 1
          fi

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build -- --win --publish never

      - name: Collect the release files (exactly one .exe, its blockmap, latest.yml)
        run: node build-scripts/stage-release-assets.js dist stage --platform windows

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: stage/*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils

      - run: npm ci

      - run: npm run build -- --linux --publish never

      - name: Collect the release files (exactly one .rpm, one .deb, latest-linux.yml)
        run: node build-scripts/stage-release-assets.js dist stage --platform linux

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: stage/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build-windows, build-linux]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: List the files about to be published
        run: ls -la release-assets

      - name: Publish the GitHub Release
        run: node build-scripts/publish-release.js release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force }}
