
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build -- --publish never

      - name: Verify exactly one Windows installer was produced
        shell: bash
        run: |
          set -e
          # electron-builder's NSIS target writes a temporary
          # "<name>__uninstaller.exe" helper into dist/ while it builds the
          # real installer, then deletes it once the installer is signed.
          # If Windows Defender (or another AV) locks that file mid-build,
          # the delete can silently fail and the leftover helper matches
          # the same dist/*.exe glob as the real installer — that's how a
          # release ends up with two .exe assets instead of one. Ignore it
          # explicitly instead of trusting the cleanup to always succeed.
          shopt -s nullglob
          installers=()
          for f in dist/*.exe; do
            case "$f" in
              *__uninstaller.exe) echo "Ignoring NSIS temp file: $f" ;;
              *) installers+=("$f") ;;
            esac
          done
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "::error::No Windows installer found in dist/."
            exit 1
          fi
          if [ "${#installers[@]}" -gt 1 ]; then
            echo "::error::Expected exactly one Windows installer, found ${#installers[@]}: ${installers[*]}"
            exit 1
          fi
          echo "Windows installer present: ${installers[0]}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            !dist/*__uninstaller.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install RPM packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils

      - run: npm ci

      - run: npm run build -- --publish never

      - name: Verify the Linux RPM was produced
        run: |
          set -e
          ls dist/*.rpm
          echo "Linux RPM present."

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: |
            dist/*.rpm
            dist/*.yml
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: release-assets

      - name: List assets about to be published
        run: ls -la release-assets

      - name: Publish (or update) the GitHub Release for this version
        run: node build-scripts/publish-release.js release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up if a duplicate release slipped through anyway
        run: node build-scripts/reconcile-github-release.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
