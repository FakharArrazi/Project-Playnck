<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: playnck-file:; media-src 'self' blob: playnck-file:; connect-src 'self' https://lrclib.net playnck-file:; object-src 'none'; base-uri 'none'">
<title>Playnck</title>
<link rel="stylesheet" href="styles.css">
<script src="theme-boot.js"></script>
</head>
<body>
<header class="native-titlebar" aria-hidden="true">
  <img src="icons/icon.ico" alt="">
  <span>Playnck</span>
</header>
<div class="app" id="appRoot">

  <nav class="rail" id="rail">
    <button class="rail-toggle" id="railToggle" title="Expand menu" data-i18n-title="nav.expandMenu">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <div class="rail-section">
      <button class="rail-item" data-tab="home" title="Home" data-i18n-title="nav.home">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V9.5"/></svg>
        <span class="rail-label" data-i18n="nav.home">Home</span>
      </button>
      <button class="rail-item active" data-tab="songs" title="Songs" data-i18n-title="nav.songs">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span class="rail-label" data-i18n="nav.songs">Songs</span>
      </button>
      <button class="rail-item" data-tab="albums" title="Albums" data-i18n-title="nav.albums">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
        <span class="rail-label" data-i18n="nav.albums">Albums</span>
      </button>
      <button class="rail-item" data-tab="artists" title="Artists" data-i18n-title="nav.artists">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="rail-label" data-i18n="nav.artists">Artists</span>
      </button>
      <button class="rail-item" data-tab="playlists" title="Playlists" data-i18n-title="nav.playlists">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="16" y2="6"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="18" x2="10" y2="18"/><path d="M19 10v8a2 2 0 1 1-2-2h2z"/></svg>
        <span class="rail-label" data-i18n="nav.playlists">Playlists</span>
      </button>
      <button class="rail-item" data-tab="folders" title="Folders" data-i18n-title="nav.folders">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span class="rail-label" data-i18n="nav.folders">Folders</span>
      </button>
      <button class="rail-item" data-tab="convert" title="Convert" data-i18n-title="nav.convert">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></svg>
        <span class="rail-label" data-i18n="nav.convert">Convert</span>
      </button>
    </div>

    <div class="rail-section rail-bottom">
      <button class="rail-item" id="railSettingsBtn" title="Settings" data-i18n-title="nav.settings">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="rail-label" data-i18n="nav.settings">Settings</span>
      </button>
      <button class="rail-item" id="railAboutBtn" title="About Us" data-i18n-title="nav.aboutUs">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span class="rail-label" data-i18n="nav.aboutUs">About Us</span>
      </button>
    </div>
  </nav>

  <aside class="sidebar">

    <div class="brand">
      <h1 class="brand-title" aria-label="PLAYNCK">
        <span class="bt-word" aria-hidden="true">
          <span class="bt-letter">P</span><span class="bt-letter">L</span><span class="bt-letter bt-accent">A</span><span class="bt-letter">Y</span><span class="bt-letter">N</span><span class="bt-letter">C</span><span class="bt-letter bt-accent">K</span>
        </span>
      </h1>
    </div>

    <input type="file" id="filesInput" accept="audio/*" multiple class="hidden">
    <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden">

    <input type="file" id="convertFilesInput" accept="audio/*" multiple class="hidden">

    <div class="list-header">
      <div class="left">
        <button class="back-btn hidden" id="backBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span class="list-title" id="listTitle">Songs</span>
      </div>
      <div class="header-icons">
        <button class="icon-btn hidden" id="addMusicToggle" title="Add music to this playlist" data-i18n-title="header.addMusicToThisPlaylist">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="icon-btn" id="searchToggle" title="Search" data-i18n-title="header.search">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn" id="locatePlayingToggle" title="Jump to playing song" data-i18n-title="header.jumpToPlaying">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6" fill="currentColor" stroke="none"/></svg>
        </button>
        <button class="icon-btn" id="sortToggle" title="Sort songs" data-i18n-title="header.sortSongs">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="13" y2="6"/>
            <line x1="3" y1="12" x2="10" y2="12"/>
            <line x1="3" y1="18" x2="7" y2="18"/>
            <line x1="17" y1="5" x2="17" y2="19"/>
            <polyline points="13 15 17 19 21 15"/>
          </svg>
        </button>
        <button class="icon-btn hidden" id="selectToggle" title="Select songs">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="search-row hidden" id="searchRow">
      <input type="text" id="searchInput" placeholder="Search…" data-i18n-placeholder="search.placeholder">
    </div>

    <div class="list-container" id="listContainer"></div>

    <div class="selection-bar hidden" id="selectionBar">
      <span class="sel-count" id="selCount">0 selected</span>
      <div class="sel-actions">
        <button class="sel-btn" id="selAddPlaylistBtn" data-i18n="sel.addToPlaylist">Add to Playlist</button>
        <button class="sel-btn danger" id="selDeleteBtn" data-i18n="sel.delete">Delete</button>
        <button class="sel-cancel" id="selCancelBtn" title="Cancel selection" data-i18n-title="sel.cancelSelection">&times;</button>
      </div>
    </div>
  </aside>

  <main class="player-panel" id="playerPanel">

    <div class="player-bg hidden" id="playerBg"></div>

    <canvas class="visualizer-canvas hidden" id="visualizerCanvas"></canvas>

    <button class="close-overlay" id="closeOverlay">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>

    <button class="icon-btn side-menu-btn" id="sideMenuBtn" title="More options" data-i18n-title="side.moreOptions">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>

    <div class="side-dropdown hidden" id="sideDropdown">
      <button id="menuInfoBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="side.info">Info</span>
      </button>
      
      <button id="menuEditBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <span data-i18n="side.edit">Edit</span>
      </button>

      <button id="menuSyncBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span data-i18n="side.syncLyrics">Sync Lyrics</span>
      </button>

      <button id="menuSleepBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span data-i18n="side.sleepTimer">Sleep Timer</span>
      </button>

      <button id="menuHistoryBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 2.6 6.4"/><polyline points="3 16 3 11 8 11"/><path d="M12 7v5l3.5 2"/></svg>
        <span data-i18n="side.history">History</span>
      </button>
    </div>


    <button class="icon-btn volume-btn" id="volumeBtn" title="Volume" data-i18n-title="player.volume">
      <svg id="volumeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 8 9 12 5 12 19 8 15 4 15" fill="currentColor" stroke="none"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>

    <div class="volume-popup hidden" id="volumePopup">
      <span class="volume-pct" id="volumePct">80%</span>
      <div class="volume-slider-wrap">
        <input type="range" id="volumeSlider" min="0" max="100" value="80" title="Volume" data-i18n-title="player.volume">
      </div>
    </div>


    <div class="now-playing-center">
      <div class="art-wrap" id="artWrap">
        <div class="art-carousel" id="artCarousel">
          <div class="art-slot art-slot-empty" data-role="prev">
            <img class="art-slot-img hidden" alt="">
            <div class="art-placeholder hidden">
              <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><path d="M9.5 8.5l6 3.5-6 3.5z" fill="currentColor" stroke="none"/></svg>
            </div>
          </div>
          <div class="art-slot" data-role="current">
            <img class="art-slot-img hidden" alt="cover">
            <div class="art-placeholder">
              <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><path d="M9.5 8.5l6 3.5-6 3.5z" fill="currentColor" stroke="none"/></svg>
            </div>
          </div>
          <div class="art-slot art-slot-empty" data-role="next">
            <img class="art-slot-img hidden" alt="">
            <div class="art-placeholder hidden">
              <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><path d="M9.5 8.5l6 3.5-6 3.5z" fill="currentColor" stroke="none"/></svg>
            </div>
          </div>
        </div>
        <div class="lyrics-pane hidden" id="lyricsPane"></div>
      </div>

      <div class="track-meta">
        <p class="t-title" id="trackTitle">Nothing playing</p>
        <p class="t-artist" id="trackArtist">Add some songs to get started</p>
        <p class="t-album" id="trackAlbum"></p>
      </div>

      <div class="meta-actions">
        <button id="lyricsBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
          <span data-i18n="player.lyrics">Lyrics</span>
        </button>
        <button id="loveBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span data-i18n="player.love">Love</span>
        </button>
      </div>

      <div class="progress-row">
        <span id="curTime">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0">
        <span id="durTime">0:00</span>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn" id="shuffleBtn" title="Shuffle" data-i18n-title="player.shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="ctrl-btn" id="prevBtn" title="Previous" data-i18n-title="player.previous">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="19 20 9 12 19 4"/><rect x="5" y="4" width="2.5" height="16"/></svg>
        </button>
        <button class="morph-btn" id="playBtn" type="button" aria-pressed="false" aria-label="Play" data-i18n-aria-label="player.play">
          <div class="glass-wrap" id="glassWrap">
            <div class="glass-shape" id="glassShape"></div>
            <div class="glass-highlight" id="glassHighlight"></div>
            <svg class="icon-rim" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" id="rimGradStart" />
                  <stop offset="100%" id="rimGradEnd" />
                </linearGradient>
                <clipPath id="glassClip" clipPathUnits="objectBoundingBox">
                  <path id="glassClipPath" d=""></path>
                </clipPath>
              </defs>
              <path id="rimGlow" class="rim-glow" d=""></path>
              <path id="rimCrisp" class="rim-crisp" d=""></path>
            </svg>
          </div>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next" data-i18n-title="player.next">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 4 15 12 5 20"/><rect x="16.5" y="4" width="2.5" height="16"/></svg>
        </button>
        <button class="ctrl-btn" id="repeatBtn" title="Repeat" data-i18n-title="player.repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span class="repeat-badge" id="repeatBadge"></span>
        </button>
      </div>
    </div>
  </main>
</div>

<div class="mini-bar" id="miniBar">
  <img id="miniArt" alt="">
  <div class="info" id="miniInfo">
    <div class="title" id="miniTitle">Nothing playing</div>
    <div class="artist" id="miniArtist">—</div>
  </div>
  <div class="mini-controls">
    <button id="miniPrev"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="19 20 9 12 19 4"/><rect x="5" y="4" width="2.5" height="16"/></svg></button>
    <button id="miniPlay"><svg id="miniPlayIcon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 3 20 12 6 21"/></svg></button>
    <button id="miniNext"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 4 15 12 5 20"/><rect x="16.5" y="4" width="2.5" height="16"/></svg></button>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalTitle">Info</h3>
      <button class="icon-btn" id="modalCloseBtn" title="Close" data-i18n-title="modal.close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="drag-drop-overlay hidden" id="dragDropOverlay">
  <div class="drag-drop-message">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span data-i18n="dragDrop.dropToPlay">Drop to play</span>
  </div>
</div>

<audio id="audioEl" preload="metadata" crossorigin="anonymous"></audio>

<script src="vendor/jsmediatags.min.js"></script>
<script type="module" src="script.js"></script>
<script src="renderer-bridge.js"></script>
<script src="player-marquee.js"></script>
</body>
</html>
